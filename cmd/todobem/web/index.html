<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a5c5df'/%3E%3Cstop offset='1' stop-color='%2386d0b9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">

<body>
<a class="skip" href="#main">Skip to content</a>
<aside class="sidebar" aria-label="Main navigation">
  <button class="brand" data-action="sessions" aria-label="todobem, open sessions"><i class="brand-mark" aria-hidden="true"></i>todobem</button>
  <p class="brand-caption">A little less time in the loop.</p>
  <p class="eyebrow nav-label">WORKSPACE</p>
  <button class="nav-item" data-action="sessions" id="navSessions"><span data-icon="grid"></span>Sessions<span class="nav-count" id="navCount"></span></button>
  <button class="nav-item" data-action="session" id="navSession"><span data-icon="timeline"></span>Session view</button>
  <button class="nav-item" data-action="insights" id="navInsights"><span data-icon="target"></span>Insights</button>
  <p class="eyebrow nav-label">IN FOCUS</p>
  <div id="focusCard"></div>
  <div class="sidebar-bottom">
    <button class="nav-item" data-action="settings" id="navSettings"><span data-icon="gear"></span>Settings</button>
    <button class="nav-item" data-action="guide"><span data-icon="help"></span>Reading the timeline</button>
    <div class="sidebar-note" id="sidebarNote">Codex &amp; Claude Code logs · local only<br><span class="note-sub">todobem / 0.1</span></div>
  </div>
</aside>
<div class="main-shell">
  <header class="topbar">
    <div class="breadcrumb" id="breadcrumb"></div>
    <button class="brand mobile-brand" data-action="sessions"><i class="brand-mark" aria-hidden="true"></i>todobem</button>
    <div class="top-actions">
      <span class="live-label" id="liveLabel"></span>
      <nav class="mobile-nav" aria-label="Mobile navigation"><button class="btn" data-action="sessions" id="mobileSessions">Sessions</button><button class="btn" data-action="session" id="mobileSession">View</button><button class="btn" data-action="insights" id="mobileInsights">Insights</button></nav>
      <button class="btn ghost" data-action="lock" id="lockBtn" title="Lock the viewer: a new token is needed to open it again" hidden><span data-icon="shield"></span>Lock</button>
      <button class="btn icon-only ghost mobile-only" data-action="settings" aria-label="Settings"><span data-icon="gear"></span></button>
      <button class="btn icon-only ghost" data-action="guide" aria-label="How to read the timeline"><span data-icon="help"></span></button>
    </div>
  </header>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
</div>
<dialog class="inspector" id="inspector" aria-labelledby="inspectorTitle"></dialog>
<dialog class="guide-dialog" id="guide" aria-labelledby="guideTitle"></dialog>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="grain.js"></script>
<script src="build.js"></script>
<script src="filter.js"></script>
<script src="dropdown.js"></script>
<script src="markdown.js"></script>
<script src="inspector.js"></script>
<script src="insights.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
